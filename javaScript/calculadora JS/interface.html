<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="interface.css">
</head>
<body>
    <div id="main">
        <div id="viewr">
            <input id="tela" type="text" placeholder="0">
        </div>
        <div id="btn">
            <table>
                <tr>
                    <td><button onclick=pegarNumero(7) class="numbers">7</button></td>
                    <td><button onclick=pegarNumero(8) class="numbers">8</button></td>
                    <td><button onclick=pegarNumero(9) class="numbers">9</button></td>
                    <td><button>÷</button></td>
                </tr>
                <tr>
                    <td><button onclick=pegarNumero(4) class="numbers">4</button></td>
                    <td><button onclick=pegarNumero(5) class="numbers">5</button></td>
                    <td><button onclick=pegarNumero(6) class="numbers">6</button></td>
                    <td><button>×</button></td>
                </tr>
                <tr>
                    <td><button onclick=pegarNumero(1) class="numbers">1</button></td>
                    <td><button onclick=pegarNumero(2) class="numbers">2</button></td>
                    <td><button onclick=pegarNumero(3) class="numbers">3</button></td>
                    <td><button>-</button></td>
                    <td><button onclick=ac()>AC</button></td>
                </tr>
                <tr>
                    <td><button onclick=pegarNumero(0) class="numbers">0</button></td>
                    <td><button>.</button></td>
                    <td><button onclick="organizar()">=</button></td>
                    <td><button onclick="pegarOperacao('+')">+</button></td>
                    <td><button>%</button></td>
                </tr>
            </table>
        </div>
    </div>
    <script src="arquivojs.js"></script>
</body>
</html>
